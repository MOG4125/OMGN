<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>OMGN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* Screenshot capture layer - invisible on screen, visible in screenshot */
        .screenshot-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
            
            /* Invisible to human eyes but visible to screenshot capture */
            opacity: 0;
            mix-blend-mode: multiply;
        }

        .screenshot-text {
            font-family: var(--omgn-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto);
            font-size: var(--omgn-font-size, 72px);
            font-weight: var(--omgn-font-weight, 300);
            color: var(--omgn-text-color, #ffffff);
            letter-spacing: var(--omgn-letter-spacing, 8px);
            text-align: center;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Customizable root variables */
        :root {
            --omgn-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            --omgn-font-size: 72px;
            --omgn-font-weight: 300;
            --omgn-text-color: #ffffff;
            --omgn-letter-spacing: 8px;
            --omgn-message: 'hello';
        }

        /* Debug indicator (hidden by default) */
        .debug-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 12px;
            background: rgba(0, 255, 0, 0.3);
            color: #00ff00;
            border-radius: 4px;
            font-size: 10px;
            font-family: monospace;
            display: none;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Invisible screenshot capture layer -->
        <div class="screenshot-layer" id="screenshotLayer">
            <div class="screenshot-text" id="omgnMessage">hello</div>
        </div>
    </div>

    <!-- Debug indicator -->
    <div class="debug-indicator" id="debugIndicator"></div>

    <script>
        // OMGN Tool - Universal Screenshot Detection
        window.OMGN = {
            config: {
                message: 'hello',
                fontSize: '72px',
                fontWeight: '300',
                textColor: '#ffffff',
                letterSpacing: '8px',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto',
                backgroundColor: '#000000',
                debug: false
            },

            // Configure the tool
            configure: function(options) {
                if (!options) return this.config;

                this.config = Object.assign({}, this.config, options);
                this.applyConfig();

                try {
                    localStorage.setItem('omgn_config', JSON.stringify(this.config));
                } catch (e) {
                    // localStorage not available
                }

                return this.config;
            },

            // Apply configuration
            applyConfig: function() {
                const root = document.documentElement;
                root.style.setProperty('--omgn-font-size', this.config.fontSize);
                root.style.setProperty('--omgn-font-weight', this.config.fontWeight);
                root.style.setProperty('--omgn-text-color', this.config.textColor);
                root.style.setProperty('--omgn-letter-spacing', this.config.letterSpacing);
                root.style.setProperty('--omgn-font-family', this.config.fontFamily);

                const messageEl = document.getElementById('omgnMessage');
                if (messageEl) {
                    messageEl.textContent = this.config.message;
                }

                document.body.style.backgroundColor = this.config.backgroundColor;
            },

            // Get current configuration
            getConfig: function() {
                return JSON.parse(JSON.stringify(this.config));
            },

            // Reset to defaults
            reset: function() {
                this.config = {
                    message: 'hello',
                    fontSize: '72px',
                    fontWeight: '300',
                    textColor: '#ffffff',
                    letterSpacing: '8px',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto',
                    backgroundColor: '#000000',
                    debug: false
                };
                this.applyConfig();
                return this.config;
            },

            // Debug logging
            debug: function(msg) {
                if (this.config.debug) {
                    console.log('[OMGN Debug]', msg);
                    const indicator = document.getElementById('debugIndicator');
                    if (indicator) {
                        indicator.textContent = msg;
                        indicator.style.display = 'block';
                        setTimeout(() => {
                            indicator.style.display = 'none';
                        }, 2000);
                    }
                }
            }
        };

        // Universal Screenshot Detection System
        class ScreenshotDetector {
            constructor() {
                this.isScreenshotting = false;
                this.screenshotLayer = document.getElementById('screenshotLayer');
                this.lastScreenshotTime = 0;
                this.screenshotThrottle = 500; // ms
                
                this.setupDetection();
                this.logDeviceInfo();
            }

            logDeviceInfo() {
                console.log('%cOMGN Screenshot Detector Active', 'color: #fff; background: #000; padding: 4px 8px; border-radius: 3px;');
                console.log('Supported screenshot combos:');
                console.log('  📸 Volume Up + Power (all iPads)');
                console.log('  📸 Home + Power (iPad 1-4, iPad Mini 1-4)');
                console.log('  📸 Home + Top Button (iPad 5+, iPad Air, iPad Pro)');
                console.log('  📸 Side Button x2 (iPad Pro 11/12.9)');
            }

            setupDetection() {
                // Method 1: Visibility Change (triggers when app goes background)
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.onScreenshotDetected('visibility-change');
                    }
                });

                // Method 2: Window Resize (iPad orientation/screenshot)
                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        this.onScreenshotDetected('resize');
                    }, 100);
                });

                // Method 3: Orientation Change
                window.addEventListener('orientationchange', () => {
                    this.onScreenshotDetected('orientation-change');
                });

                // Method 4: Print Event (some iOS versions trigger this)
                window.addEventListener('beforeprint', () => {
                    this.showScreenshotContent();
                    OMGN.debug('Print mode activated');
                });

                window.addEventListener('afterprint', () => {
                    this.hideScreenshotContent();
                });

                // Method 5: Key Press Detection (Volume, Home, Power buttons)
                document.addEventListener('keydown', (e) => {
                    // Volume Up/Down (keyCode 91, 93)
                    if (e.keyCode === 91 || e.keyCode === 93) {
                        this.onScreenshotDetected('volume-button');
                    }
                    // Power button and Home often don't fire keydown, but we try
                    // Simultaneous key press detection
                    if (e.metaKey && (e.shiftKey || e.ctrlKey)) {
                        this.onScreenshotDetected('meta-combo');
                    }
                });

                // Method 6: Clipboard Monitoring (screenshot goes to clipboard)
                this.monitorClipboard();

                // Method 7: Touch Events (detect unusual patterns that precede screenshots)
                let touchCount = 0;
                document.addEventListener('touchstart', () => {
                    touchCount++;
                    if (touchCount > 2) {
                        // Multiple touches - possible button combo press
                        this.onScreenshotDetected('multi-touch');
                        touchCount = 0;
                    }
                });

                // Method 8: Accelerometer / Motion (optional - not reliable)
                if (window.DeviceMotionEvent) {
                    window.addEventListener('devicemotion', (e) => {
                        // Unusual acceleration could indicate button press
                    });
                }
            }

            monitorClipboard() {
                // Poll clipboard every 500ms for new images
                setInterval(async () => {
                    try {
                        const items = await navigator.clipboard.read();
                        if (items && items.length > 0) {
                            const item = items[0];
                            if (item.types && (item.types.includes('image/png') || item.types.includes('image/jpeg'))) {
                                this.onScreenshotDetected('clipboard-image');
                            }
                        }
                    } catch (e) {
                        // Clipboard access denied (expected)
                    }
                }, 500);
            }

            onScreenshotDetected(method) {
                const now = Date.now();
                
                // Throttle to prevent multiple triggers
                if (now - this.lastScreenshotTime < this.screenshotThrottle) {
                    return;
                }
                this.lastScreenshotTime = now;

                OMGN.debug(`Screenshot detected via: ${method}`);
                this.captureScreenshot();
            }

            showScreenshotContent() {
                this.screenshotLayer.style.opacity = '1';
                this.screenshotLayer.style.mixBlendMode = 'normal';
                document.body.style.backgroundColor = '#ffffff';
            }

            hideScreenshotContent() {
                this.screenshotLayer.style.opacity = '0';
                this.screenshotLayer.style.mixBlendMode = 'multiply';
                document.body.style.backgroundColor = OMGN.config.backgroundColor;
            }

            captureScreenshot() {
                console.log('🎯 Screenshot detected - showing "hello"');
                this.showScreenshotContent();
                
                // Keep content visible for 3 seconds to ensure capture
                setTimeout(() => {
                    this.hideScreenshotContent();
                }, 3000);
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Load saved config
            try {
                const saved = localStorage.getItem('omgn_config');
                if (saved) {
                    window.OMGN.configure(JSON.parse(saved));
                }
            } catch (e) {
                // localStorage not available
            }

            window.OMGN.applyConfig();

            // Initialize detector
            new ScreenshotDetector();

            console.log('✨ OMGN ready - take a screenshot!');
        });

        // Helpers in console
        console.log('%cOMGN Console Commands', 'color: #fff; background: #000; padding: 4px 8px; border-radius: 3px; font-weight: bold;');
        console.log('OMGN.configure({message: "hello", fontSize: "72px"}) - customize');
        console.log('OMGN.getConfig() - view current config');
        console.log('OMGN.reset() - reset to defaults');
        console.log('OMGN.configure({debug: true}) - enable debug mode');
    </script>
</body>
</html>
