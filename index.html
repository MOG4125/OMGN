<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMGN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hidden by default (visible on screen) */
        .screen-only {
            position: absolute;
            color: rgba(0, 0, 0, 0);
            font-size: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* Visible only during screenshot via print media */
        @media print {
            body {
                background: #ffffff;
            }

            .screen-only {
                display: none;
            }

            .screenshot-only {
                display: flex !important;
            }
        }

        /* Hidden by default, shown on screenshot */
        .screenshot-only {
            display: none;
            font-size: 72px;
            font-weight: 300;
            letter-spacing: 8px;
            color: #000000;
            text-align: center;
            white-space: nowrap;
        }

        /* Customizable text via CSS variable */
        .screenshot-text {
            font-family: var(--omgn-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto);
            font-size: var(--omgn-font-size, 72px);
            font-weight: var(--omgn-font-weight, 300);
            color: var(--omgn-text-color, #000000);
            letter-spacing: var(--omgn-letter-spacing, 8px);
        }

        /* Custom styling options */
        :root {
            --omgn-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            --omgn-font-size: 72px;
            --omgn-font-weight: 300;
            --omgn-text-color: #000000;
            --omgn-letter-spacing: 8px;
            --omgn-bg-color: #ffffff;
            --omgn-message: 'hello';
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Invisible element for screen view -->
        <div class="screen-only">OMGN</div>

        <!-- Visible only when screenshotted -->
        <div class="screenshot-only">
            <div class="screenshot-text" id="omgnMessage">hello</div>
        </div>
    </div>

    <script>
        // Detect screenshot attempts
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Screenshot detected or app backgrounded');
            }
        });

        // Listen for print (screenshot on iOS/iPad)
        window.addEventListener('beforeprint', () => {
            console.log('Print triggered - screenshot detected');
        });

        // Configuration function - customize the tool
        window.OMGN = {
            configure: function(options) {
                const defaults = {
                    message: 'hello',
                    fontSize: '72px',
                    fontWeight: '300',
                    textColor: '#000000',
                    letterSpacing: '8px',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto'
                };

                const config = Object.assign(defaults, options);

                // Apply custom configuration
                document.documentElement.style.setProperty('--omgn-message', `'${config.message}'`);
                document.documentElement.style.setProperty('--omgn-font-size', config.fontSize);
                document.documentElement.style.setProperty('--omgn-font-weight', config.fontWeight);
                document.documentElement.style.setProperty('--omgn-text-color', config.textColor);
                document.documentElement.style.setProperty('--omgn-letter-spacing', config.letterSpacing);
                document.documentElement.style.setProperty('--omgn-font-family', config.fontFamily);
                document.documentElement.style.setProperty('--omgn-bg-color', config.backgroundColor);

                document.getElementById('omgnMessage').textContent = config.message;

                return config;
            },

            // Get current configuration
            getConfig: function() {
                return {
                    message: getComputedStyle(document.documentElement).getPropertyValue('--omgn-message'),
                    fontSize: getComputedStyle(document.documentElement).getPropertyValue('--omgn-font-size'),
                    textColor: getComputedStyle(document.documentElement).getPropertyValue('--omgn-text-color')
                };
            }
        };

        // Default initialization
        console.log('OMGN Tool loaded. Use OMGN.configure({...}) to customize.');
    </script>
</body>
</html>
