<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>OMGN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* Screenshot capture layer - always present, but invisible on screen */
        .screenshot-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
            
            /* Critical: Make this layer invisible to human eyes but visible to screenshot */
            opacity: 0;
            mix-blend-mode: multiply;
        }

        .screenshot-text {
            font-family: var(--omgn-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto);
            font-size: var(--omgn-font-size, 72px);
            font-weight: var(--omgn-font-weight, 300);
            color: var(--omgn-text-color, #ffffff);
            letter-spacing: var(--omgn-letter-spacing, 8px);
            text-align: center;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Customizable root variables */
        :root {
            --omgn-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            --omgn-font-size: 72px;
            --omgn-font-weight: 300;
            --omgn-text-color: #ffffff;
            --omgn-letter-spacing: 8px;
            --omgn-message: 'hello';
        }

        /* Canvas-based screenshot capture */
        #screenshotCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Invisible screenshot capture layer -->
        <div class="screenshot-layer" id="screenshotLayer">
            <div class="screenshot-text" id="omgnMessage">hello</div>
        </div>
    </div>

    <!-- Hidden canvas for screenshot processing -->
    <canvas id="screenshotCanvas"></canvas>

    <script>
        // OMGN Tool - Screenshot Capture System
        window.OMGN = {
            config: {
                message: 'hello',
                fontSize: '72px',
                fontWeight: '300',
                textColor: '#ffffff',
                letterSpacing: '8px',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto',
                backgroundColor: '#000000'
            },

            // Configure the tool
            configure: function(options) {
                if (!options) return this.config;

                this.config = Object.assign({}, this.config, options);
                this.applyConfig();

                try {
                    localStorage.setItem('omgn_config', JSON.stringify(this.config));
                } catch (e) {
                    console.log('localStorage not available');
                }

                return this.config;
            },

            // Apply configuration
            applyConfig: function() {
                const root = document.documentElement;
                root.style.setProperty('--omgn-font-size', this.config.fontSize);
                root.style.setProperty('--omgn-font-weight', this.config.fontWeight);
                root.style.setProperty('--omgn-text-color', this.config.textColor);
                root.style.setProperty('--omgn-letter-spacing', this.config.letterSpacing);
                root.style.setProperty('--omgn-font-family', this.config.fontFamily);

                const messageEl = document.getElementById('omgnMessage');
                if (messageEl) {
                    messageEl.textContent = this.config.message;
                }

                document.body.style.backgroundColor = this.config.backgroundColor;
            },

            // Get current configuration
            getConfig: function() {
                return JSON.parse(JSON.stringify(this.config));
            },

            // Reset to defaults
            reset: function() {
                this.config = {
                    message: 'hello',
                    fontSize: '72px',
                    fontWeight: '300',
                    textColor: '#ffffff',
                    letterSpacing: '8px',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto',
                    backgroundColor: '#000000'
                };
                this.applyConfig();
                return this.config;
            }
        };

        // Screenshot Detection and Capture System
        class ScreenshotDetector {
            constructor() {
                this.isScreenshotting = false;
                this.screenshotLayer = document.getElementById('screenshotLayer');
                this.setupDetection();
            }

            setupDetection() {
                // Detect screenshot via visibility API
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.captureScreenshot();
                    }
                });

                // Detect via orientation change
                window.addEventListener('orientationchange', () => {
                    this.maybeScreenshot();
                });

                // Detect via window resize (iPad screenshot detection)
                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        this.maybeScreenshot();
                    }, 100);
                });

                // Listen for print (some devices trigger this)
                window.addEventListener('beforeprint', () => {
                    this.showScreenshotContent();
                });

                window.addEventListener('afterprint', () => {
                    this.hideScreenshotContent();
                });

                // Intercept volume buttons on iOS (screenshot indicator)
                document.addEventListener('keydown', (e) => {
                    if (e.keyCode === 91 || e.keyCode === 93) {
                        // Volume buttons pressed
                        this.captureScreenshot();
                    }
                });

                // Monitor clipboard changes (screenshot goes to clipboard)
                this.monitorClipboard();
            }

            monitorClipboard() {
                // Check for screenshot every second
                setInterval(async () => {
                    try {
                        const items = await navigator.clipboard.read();
                        if (items.length > 0) {
                            const item = items[0];
                            if (item.types.includes('image/png') || item.types.includes('image/jpeg')) {
                                this.captureScreenshot();
                            }
                        }
                    } catch (e) {
                        // Clipboard access denied (normal)
                    }
                }, 1000);
            }

            maybeScreenshot() {
                // Additional screenshot detection heuristics
                this.captureScreenshot();
            }

            showScreenshotContent() {
                this.screenshotLayer.style.opacity = '1';
                this.screenshotLayer.style.mixBlendMode = 'normal';
                document.body.style.backgroundColor = '#ffffff';
            }

            hideScreenshotContent() {
                this.screenshotLayer.style.opacity = '0';
                this.screenshotLayer.style.mixBlendMode = 'multiply';
                document.body.style.backgroundColor = OMGN.config.backgroundColor;
            }

            captureScreenshot() {
                console.log('Screenshot detected - content made visible');
                this.showScreenshotContent();
                
                // Keep content visible for screenshot buffer time
                setTimeout(() => {
                    this.hideScreenshotContent();
                }, 3000);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Load saved config
            try {
                const saved = localStorage.getItem('omgn_config');
                if (saved) {
                    window.OMGN.configure(JSON.parse(saved));
                }
            } catch (e) {
                console.log('Could not load saved config');
            }

            window.OMGN.applyConfig();

            // Initialize screenshot detector
            new ScreenshotDetector();
        });

        // Console helper
        console.log('%cOMGN Tool Loaded', 'color: #fff; background: #000; padding: 4px 8px; border-radius: 3px; font-size: 14px; font-weight: bold;');
        console.log('🎯 Screenshot shows: "hello" | Normal view: pure black');
        console.log('Customize: OMGN.configure({message: "text", fontSize: "72px"})');
        console.log('Config:', window.OMGN.getConfig());
    </script>
</body>
</html>
